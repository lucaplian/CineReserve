services:
  kong-db:
    image: postgres:13.2-alpine
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong-db-vol:/var/lib/postgresql/data
    networks:
      - cinereserve-gateway-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  kong-migrations:
    image: kong:latest
    command: >
      sh -c "kong migrations bootstrap && kong migrations up"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    networks:
      - cinereserve-gateway-network
    deploy:
      restart_policy:
        condition: none

  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - cinereserve-gateway-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - cinereserve-monitoring-network
      - cinereserve-auth-network
      - cinereserve-catalog-network
      - cinereserve-booking-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    networks:
      - cinereserve-monitoring-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cinereserve-auth-db:
    image: postgres:13.2-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cinereserve-auth
      POSTGRES_DB: cinereserve-auth
      POSTGRES_PASSWORD: cinereserve-auth
    volumes:
      - cinereserve-auth-db-vol:/var/lib/postgresql/data
    networks:
      - cinereserve-auth-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cinereserve-booking-db:
    image: postgres:13.2-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: cinereserve-booking
      POSTGRES_DB: cinereserve-booking
      POSTGRES_PASSWORD: cinereserve-booking
    volumes:
      - cinereserve-booking-db-vol:/var/lib/postgresql/data
    networks:
      - cinereserve-booking-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cinereserve-catalog-db:
    image: postgres:13.2-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: cinereserve-catalog
      POSTGRES_DB: cinereserve-catalog
      POSTGRES_PASSWORD: cinereserve-catalog
    volumes:
      - cinereserve-catalog-db-vol:/var/lib/postgresql/data
    networks:
      - cinereserve-catalog-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cinereserve-auth-service:
    image: lucaplian6650/cinereserve-auth:latest
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebAppDatabase=Host=cinereserve-auth-db;Port=5432;Database=cinereserve-auth;Username=cinereserve-auth;Password=cinereserve-auth
    networks:
      - cinereserve-auth-network
      - cinereserve-gateway-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure 

  cinereserve-catalog-service:
    image: lucaplian6650/cinereserve-catalog:latest
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebAppDatabase=Host=cinereserve-catalog-db;Port=5432;Database=cinereserve-catalog;Username=cinereserve-catalog;Password=cinereserve-catalog
    networks:
      - cinereserve-catalog-network
      - cinereserve-gateway-network
      - cinereserve-auth-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cinereserve-booking-service:
    image: lucaplian6650/cinereserve-booking:latest
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebAppDatabase=Host=cinereserve-booking-db;Port=5432;Database=cinereserve-booking;Username=cinereserve-booking;Password=cinereserve-booking
    networks:
      - cinereserve-booking-network
      - cinereserve-gateway-network
      - cinereserve-auth-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cinereserve-frontend-service:
    image: lucaplian6650/cinereserve-frontend:latest
    ports:
      - "3004:80"
    networks:
      - cinereserve-gateway-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@default.com
      - PGADMIN_DEFAULT_PASSWORD=default
    ports:
      - "5050:80"
    networks:
      - cinereserve-booking-network
      - cinereserve-auth-network
      - cinereserve-catalog-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  cinereserve-auth-db-vol:
  cinereserve-catalog-db-vol:
  cinereserve-booking-db-vol:
  kong-db-vol:

networks:
  cinereserve-booking-network:
    driver: overlay
    attachable: true
  cinereserve-auth-network:
    driver: overlay
    attachable: true
  cinereserve-catalog-network:
    driver: overlay
    attachable: true
  cinereserve-gateway-network:
    driver: overlay
    attachable: true
  cinereserve-monitoring-network:
    driver: overlay
    attachable: true