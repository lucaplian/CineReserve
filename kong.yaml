_format_version: "3.0"

services:
  - name: auth-service
    url: http://cinereserve-auth-service:8080
    routes:
      - name: auth-route
        paths:
          - /auth

  - name: catalog-service
    url: http://cinereserve-catalog-service:8080
    routes:
      - name: catalog-route
        paths:
          - /catalog

  - name: booking-service
    url: http://cinereserve-booking-service:8080
    routes:
      - name: booking-route
        paths:
          - /booking